[build-system]
# setuptools <83 carries PYSEC-2026-3447; keep the build backend patched.
requires = ["setuptools>=83.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vulnoraiq"
version = "0.3.0"
description = "VulnoraIQ AI security assessment framework for LLM applications, RAG systems, agents, and orchestration layers — production-ready for controlled internal deployment."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Rahul Sharma" }]
keywords = ["ai-security", "llm-security", "owasp", "mitre-atlas", "rag", "agent-security", "security-testing"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Environment :: Web Environment",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  "PyYAML>=6.0.1",
  "requests>=2.31.0"
]

[project.urls]
Homepage = "https://github.com/sharRahul/vulnoraiq"
Documentation = "https://github.com/sharRahul/vulnoraiq/tree/main/docs"
Source = "https://github.com/sharRahul/vulnoraiq"
Issues = "https://github.com/sharRahul/vulnoraiq/issues"
Security = "https://github.com/sharRahul/vulnoraiq/security"

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.5.0",
  "mypy>=1.10.0",
  "pip-audit>=2.7.0",
  "types-PyYAML>=6.0.12.20240311",
  "types-requests>=2.31.0.20240406"
]
release = [
  "build>=1.2.1",
  "twine>=5.1.0"
]
# Optional in-app assistant model (Ask VulnoraIQ + richer finding explanations).
# Runs a small GGUF locally via llama.cpp; weights are downloaded on first use.
# The assistant loads on GPU by default (n_gpu_layers=-1) and falls back to CPU.
#
# GPU (recommended, NVIDIA CUDA 12.x):
#   pip install "llama-cpp-python==0.3.31" --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cu124 --only-binary=:all:
#   pip install -e ".[assistant-cuda]"
#   The CUDA wheel links cudart/cublas/nvrtc; `assistant-cuda` supplies those via
#   the nvidia-*-cu12 pip packages, so no system CUDA toolkit is required.
#   assistant_llm registers site-packages/nvidia/*/bin on the Windows DLL path.
#
# CPU-only (no NVIDIA GPU):
#   pip install "llama-cpp-python==0.3.19" --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu --only-binary=:all:
#   Newer generic Windows CPU wheels (for example 0.3.30) hit `0xc000001d` on
#   AVX2-class consumer CPUs; pin 0.3.19 from the cpu index.
# - macOS Metal / MLX: TODO, not implemented yet.
assistant = [
  "llama-cpp-python>=0.3.19"
]
# GPU runtime for the CUDA llama-cpp-python wheel. Pair with the cu124 wheel
# above (installed from the llama-cpp-python CUDA index, not PyPI).
assistant-cuda = [
  "llama-cpp-python>=0.3.31",
  "nvidia-cuda-runtime-cu12>=12.4",
  "nvidia-cublas-cu12>=12.4",
  "nvidia-cuda-nvrtc-cu12>=12.4"
]

[project.scripts]
vulnoraiq = "scripts.run_scan:main"
vulnoraiq-web = "webui.server:main"
vulnoraiq-dashboard = "dashboards.generate_dashboard:main"
vulnoraiq-diff = "reports.report_diff:main"
vulnoraiq-package = "scripts.build_release_package:main"
vulnoraiq-platform-package = "scripts.build_platform_release_package:main"
vulnoraiq-benchmark = "benchmarks.run_benchmarks:main"
vulnoraiq-functional-test = "scripts.run_functional_test:main"
vulnoraiq-production-readiness = "scripts.validate_production_testing_readiness:main"
vulnoraiq-policy-trend = "reports.policy_trends:main"
vulnoraiq-diff-trend = "dashboards.diff_trend_dashboard:main"
vulnoraiq-refresh-atlas = "scripts.refresh_mitre_atlas:main"
vulnoraiq-generate-atlas-matrix = "scripts.generate_mitre_atlas_matrix:main"
vulnoraiq-html-export = "reports.html_export_package:main"
vulnoraiq-validate-package = "scripts.validate_package_metadata:main"
vulnoraiq-validate-owasp-atlas-mappings = "scripts.validate_owasp_atlas_mappings:main"
vulnoraiq-validate-genai-readiness = "scripts.validate_genai_readiness:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "integrations*", "modules*", "rag_testing*", "agent_testing*", "reports*", "dashboards*", "scripts*", "benchmarks*", "examples*", "webui*"]

[tool.setuptools.package-data]
webui = [
    "static/console/*",
    "static/console/assets/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# basetemp is intentionally left to pytest's default (under the OS temp dir).
# Pinning it inside the working tree left locked/ACL-corrupted dirs on Windows
# that made later runs fail with PermissionError as if the product were broken.
addopts = "-q"
markers = [
    "docker: requires a running Docker Engine",
]

[tool.ruff]
target-version = "py310"
line-length = 120
exclude = ["reports/output", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"scripts/validate_production_testing_readiness.py" = ["E402"]

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true
no_implicit_optional = true
check_untyped_defs = true
exclude = '''(?x)(
    ^reports/output/
  | ^build/
  | ^dist/
  | ^docker/
  | ^projects/
  | ^agent-lab/
  | ^scan-reports/
  | ^model/
  | ^\.
)'''

# numpy (pulled in only by the optional [assistant] extra) ships stubs that use
# Python 3.12+ syntax; we target 3.10, so don't follow it.
[[tool.mypy.overrides]]
module = "numpy.*"
follow_imports = "skip"
follow_imports_for_stubs = true

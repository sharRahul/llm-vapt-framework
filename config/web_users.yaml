# Web console authentication (file-based fallback).
#
# This file is only consulted when NO token environment variables are set, and
# it is refused entirely when VULNORAIQ_ENV=production. Prefer environment
# tokens everywhere:
#
#   VULNORAIQ_AUTH_MODE=token
#   VULNORAIQ_ADMIN_TOKEN=<strong-random-token>
#   VULNORAIQ_ANALYST_TOKEN=<analyst-token>
#   VULNORAIQ_VIEWER_TOKEN=<viewer-token>
#
# Local Desktop Mode needs none of this: VULNORAIQ_AUTH_MODE=local_admin
# resolves the local user as the single administrator on a loopback bind.
#
# Roles and their permissions are defined in code (webui/auth.py) and are not
# configurable here. Only `auth.header_name` and `users` are read.
#
# To add a local development user, append an entry of the shape below. Never
# commit a real token hash.
#
#   users:
#     - username: alice
#       role: admin          # admin | analyst | viewer
#       status: active
#       token_sha256: <sha256 of the bearer token>
#
# Generate a hash with:
#   python -c "import hashlib,sys;print(hashlib.sha256(sys.argv[1].encode()).hexdigest())" <token>

auth:
  header_name: X-VulnoraIQ-Token

users: []
